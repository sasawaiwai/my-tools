<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CCFOLIA チャットパレット追記</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      width: 280px;
      background: Canvas;
      color: CanvasText;
    }

    .wrap {
      padding: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.4;
    }

    .desc {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.55;
      opacity: .72;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 10px;
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #8b8b8b;
      border-radius: 999px;
      transition: .18s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: .18s;
    }

    input:checked + .slider {
      background: #2f7d32;
    }

    input:checked + .slider::before {
      transform: translateX(20px);
    }

    .note {
      margin: 12px 0 0;
      font-size: 11px;
      line-height: 1.55;
      opacity: .65;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CCFOLIA チャットパレット追記</h1>
    <p class="desc">@から始まるパレット項目を、入力中の文章の末尾へ追記します。</p>

    <div class="toggle-row">
      <span id="statusText" class="status-text">ON</span>
      <label class="switch" aria-label="拡張機能のON/OFF">
        <input id="enabledToggle" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <p class="note">OFFのときは、ココフォリア本来のチャットパレット動作になります。</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
